[package]
name = "li_watchdog_manager"
version.workspace = true
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
libc = "0.2"
li_core_interface = { path = "../interface" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
rcgen = "0.13.2"
tempfile = "3"

[lib]
path = "src/li_watchdog_manager.rs"
