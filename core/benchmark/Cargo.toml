[package]
name = "li_benchmark_manager"
version.workspace = true
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.22"
li_core_interface = { path = "../interface" }
li_database = { path = "../database" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]
rusqlite = "0.32"
tempfile = "3"

[lib]
path = "src/li_benchmark_manager.rs"
