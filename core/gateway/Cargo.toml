[package]
name = "li_gateway_manager"
version.workspace = true
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
getrandom = "0.4"
libc = "0.2"
li_authentication_manager = { path = "../authentication" }
li_core_interface = { path = "../interface" }
li_core_update_manager = { path = "../update" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
rcgen = "0.13.2"
tempfile = "3"

[lib]
path = "src/li_gateway_manager.rs"
