name: Installer builds

on:
  pull_request:
    branches:
      - main
      - release
    paths:
      - ".github/workflows/li_installer.yml"
      - "bin/li_installer_*"
      - "install.sh"
      - "installer/**"
      - "rust-toolchain.toml"
      - "schemas/li_installer_*"
      - "tests/li_installer/**"
      - "tools/li_installer_*"
      - "tools/source_archive.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/li_installer.yml"
      - "bin/li_installer_*"
      - "install.sh"
      - "installer/**"
      - "rust-toolchain.toml"
      - "schemas/li_installer_*"
      - "tests/li_installer/**"
      - "tools/li_installer_*"
      - "tools/source_archive.py"

concurrency:
  group: li_installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LI_RUST_VERSION: "1.97.1"

jobs:
  build:
    name: Build ${{ matrix.identity }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - identity: linux_arm64
            operating_system: linux
            architecture: arm64
            rust_host: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - identity: linux_x86_64
            operating_system: linux
            architecture: x86_64
            rust_host: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - identity: macos_arm64
            operating_system: macos
            architecture: arm64
            rust_host: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select and verify exact Rust toolchain
        env:
          LI_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          toolchain="$LI_RUST_VERSION-$LI_RUST_HOST"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          test "$(RUSTUP_TOOLCHAIN="$toolchain" rustc --version --verbose | sed -n 's/^release: //p')" = "$LI_RUST_VERSION"
          test "$(RUSTUP_TOOLCHAIN="$toolchain" rustc --version --verbose | sed -n 's/^host: //p')" = "$LI_RUST_HOST"
          test "$(RUSTUP_TOOLCHAIN="$toolchain" cargo --version | awk '{print $2}')" = "$LI_RUST_VERSION"
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"
      - name: Verify source formatting
        run: |
          cargo fmt --manifest-path installer/Cargo.toml --all -- --check
          cargo fmt --manifest-path tests/li_installer/validator/Cargo.toml --all -- --check
          git diff --check
      - name: Run native installer contracts
        env:
          MATRIX_OPERATING_SYSTEM: ${{ matrix.operating_system }}
        run: |
          args=(
            --cargo-command "$(command -v cargo)"
            --mktemp-command "$(command -v mktemp)"
            --rm-command "$(command -v rm)"
          )
          if [[ "$MATRIX_OPERATING_SYSTEM" == macos ]]; then
            args+=(--swiftc-command "$(command -v swiftc)")
          fi
          sh tests/li_installer/li_installer_run.sh "${args[@]}"
      - name: Prepare independent canonical source roots
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m tools.source_archive build \
            --source . --output "$RUNNER_TEMP/native-source.tar.gz"
          python3 -m tools.source_archive verify "$RUNNER_TEMP/native-source.tar.gz"
          mkdir \
            "$RUNNER_TEMP/native-source-first" \
            "$RUNNER_TEMP/native-source-second" \
            "$RUNNER_TEMP/cargo-home-first" \
            "$RUNNER_TEMP/cargo-home-second"
          tar -xzf "$RUNNER_TEMP/native-source.tar.gz" \
            -C "$RUNNER_TEMP/native-source-first"
          tar -xzf "$RUNNER_TEMP/native-source.tar.gz" \
            -C "$RUNNER_TEMP/native-source-second"
          for cache in registry git; do
            if [[ -d "$HOME/.cargo/$cache" ]]; then
              cp -R "$HOME/.cargo/$cache" "$RUNNER_TEMP/cargo-home-first/"
              cp -R "$HOME/.cargo/$cache" "$RUNNER_TEMP/cargo-home-second/"
            fi
          done
      - name: Build deterministic native archive
        env:
          MATRIX_ARCHITECTURE: ${{ matrix.architecture }}
          MATRIX_IDENTITY: ${{ matrix.identity }}
          MATRIX_OPERATING_SYSTEM: ${{ matrix.operating_system }}
        run: |
          first_source="$RUNNER_TEMP/native-source-first/letsinfer"
          second_source="$RUNNER_TEMP/native-source-second/letsinfer"
          mkdir "$RUNNER_TEMP/li_installer_first" "$RUNNER_TEMP/li_installer_second"
          args=(
            --operating-system "$MATRIX_OPERATING_SYSTEM"
            --architecture "$MATRIX_ARCHITECTURE"
            --cargo-command "$(command -v cargo)"
          )
          if [[ "$MATRIX_OPERATING_SYSTEM" == macos ]]; then
            args+=(--swiftc-command "$(command -v swiftc)")
          fi
          archive="li_installer_${MATRIX_IDENTITY}.tar.gz"
          CARGO_HOME="$RUNNER_TEMP/cargo-home-first" \
            python3 "$first_source/tools/li_installer_build_assets.py" \
            "${args[@]}" --output "$RUNNER_TEMP/li_installer_first/$archive"
          CARGO_HOME="$RUNNER_TEMP/cargo-home-second" \
            python3 "$second_source/tools/li_installer_build_assets.py" \
            "${args[@]}" --output "$RUNNER_TEMP/li_installer_second/$archive"
          cmp \
            "$RUNNER_TEMP/li_installer_first/$archive" \
            "$RUNNER_TEMP/li_installer_second/$archive"
          python3 "$first_source/tools/li_installer_build_assets.py" \
            --verify-archive \
            --operating-system "$MATRIX_OPERATING_SYSTEM" \
            --architecture "$MATRIX_ARCHITECTURE" \
            --output "$RUNNER_TEMP/li_installer_first/$archive"
      - name: Upload native archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: li_installer_${{ matrix.identity }}
          path: ${{ runner.temp }}/li_installer_first/li_installer_${{ matrix.identity }}.tar.gz
          if-no-files-found: error
          retention-days: 7
